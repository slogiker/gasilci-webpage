version: '3.8'

services:
  pgd-gasilci-node:
    build: .
    container_name: pgd-gasilci-node
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - NODE_ENV=production
    volumes:
      - ./data:/app/data
      - ./public/uploads:/app/public/uploads
