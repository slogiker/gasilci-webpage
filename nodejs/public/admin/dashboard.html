<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - PGD Majšperk Breg</title>
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
</head>
<body>
    <div class="dashboard-wrapper">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <a href="../index.html" style="text-decoration: none;"><h3 style="color: var(--primary);">PGD MAJŠPERK</h3></a>
            </div>
            <ul class="sidebar-nav">
                <li><a href="#" data-section="news" class="active"><i class="fas fa-newspaper"></i> Novice</a></li>
                <li><a href="#" data-section="gallery"><i class="fas fa-images"></i> Galerija</a></li>
                <li><a href="#" data-section="users"><i class="fas fa-users-cog"></i> Uporabniki</a></li>
                <li><a href="#" data-section="events"><i class="fas fa-calendar-alt"></i> Dogodki</a></li>
                <li><a href="#" data-section="vehicles"><i class="fas fa-truck-pickup"></i> Vozni park</a></li>
                <li><a href="#" data-section="members"><i class="fas fa-user-tie"></i> Vodstvo</a></li>
                <li><a href="#" id="logout-btn"><i class="fas fa-sign-out-alt"></i> Odjava</a></li>
            </ul>
        </aside>

        <main class="main-content">
            <header class="top-header">
                <div class="user-info" style="margin-left: auto; display: flex; align-items: center; gap: 1rem;">
                    <span id="user-email">admin@example.com</span>
                    <button class="btn btn-sm btn-delete" id="header-logout-btn" style="padding: 0.4rem 0.8rem; font-size: 0.8rem;">Odjava</button>
                </div>
            </header>

            <section class="content-area" id="content-area">
                <!-- Content will be loaded here dynamically -->
            </section>
        </main>
    </div>

    <!-- Modal for Forms -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title">Dodaj novo</h2>
                <span class="close" id="close-modal">&times;</span>
            </div>
            <div id="modal-body">
                <!-- Form will be loaded here -->
            </div>
        </div>
    </div>

    <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
