<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Prijava - PGD Majšperk Breg</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .input-wrapper { position: relative; }
        .eye-toggle {
            position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
            background: none; border: none; cursor: pointer; color: var(--text-secondary);
        }
        .toast {
            position: fixed; bottom: 2rem; right: 2rem;
            background: var(--bg-elevated); color: var(--text-primary);
            padding: 0.85rem 1.25rem; border-radius: 8px;
            border-left: 3px solid var(--red);
            font-size: 13.5px; z-index: 9999;
            transform: translateY(20px); opacity: 0;
            transition: all 0.3s ease;
        }
        .toast.show { transform: translateY(0); opacity: 1; }
        .toast.toast-success { border-left-color: #3a9e5f; }
        .login-main { min-height: calc(100vh - 60px - 100px); display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="container nav-container">
            <div class="nav-left">
                <div class="logo">
                    <a href="../index.php">
                        <img src="../img/logo-omre.png" alt="PGD Logo" style="height: 28px;">
                        <span>PGD Majšperk Breg</span>
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <main class="login-main">
        <div class="login-container" style="padding: 2rem;">
            <div class="login-card" style="max-width: 500px;">
                <div style="text-align: center; margin-bottom: 1.5rem;">
                    <img src="../img/logo-omre.png" alt="PGD Logo" style="height: 100px; margin-bottom: 1rem;">
                    <h1 style="color: var(--red); font-family: var(--font-serif); margin-bottom: 0.5rem; font-size: 2.5rem;">Admin prijava</h1>
                    <p style="color: var(--text-secondary);">Administracija spletne strani</p>
                </div>
                <form id="login-form">
                    <div class="form-group">
                        <label for="email" style="color: var(--yellow);">E-pošta ali uporabniško ime</label>
                        <input type="text" id="email" name="email" required placeholder="vnesite e-pošto ali uporabniško ime">
                    </div>
                    <div class="form-group">
                        <label for="password" style="color: var(--yellow);">Geslo</label>
                        <div class="input-wrapper">
                            <input type="password" id="password" name="password" required placeholder="vnesite geslo">
                            <button type="button" class="eye-toggle" onclick="togglePassword()">👁</button>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-red" style="width: 100%; padding: 1rem; font-size: 1.1rem; margin-top: 1rem;">Prijava</button>
                </form>
            </div>
        </div>
    </main>

    <footer style="text-align: center; padding: 2rem; border-top: 1px solid var(--bg-border);">
        <p style="font-size: 0.85rem; color: var(--text-tertiary);">&copy; 2024 PGD Majšperk Breg. Vse pravice pridržane.</p>
    </footer>

    <script src="js/admin.js"></script>
    <script>
        function togglePassword() {
            const input = document.getElementById('password');
            input.type = input.type === 'password' ? 'text' : 'password';
        }

        function showToast(message, type = 'error') {
            const toast = document.createElement('div');
            toast.className = 'toast toast-' + type;
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.classList.add('show'), 10);
            setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 300); }, 3500);
        }

        document.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem('pgd_token')) {
                window.location.href = 'dashboard.html';
            }
        });
    </script>
</body>
</html>
